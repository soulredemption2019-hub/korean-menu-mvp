<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 메뉴 번역</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍜 한국 메뉴 번역</h1>
      <p class="subtitle">한국 음식 메뉴 검색 도구</p>
    </header>

    <main>
      <section class="search-box">
        <input type="text" id="dish-input" placeholder="메뉴 이름을 입력하세요. 예: 김치찌개" autocomplete="off">
        <button id="search-btn">검색</button>
      </section>

      <section class="quick-tags" id="quick-tags">
        <!-- 자주 찾는 메뉴 빠른 버튼 (app.js에서 생성) -->
      </section>

      <section id="result" class="result hidden">
        <div class="result-card">
          <h2 id="dish-name"></h2>
          <p class="romanization" id="dish-roman"></p>
          <div class="spice-row">
            <span class="label">맵기</span>
            <span id="spice-level" class="spice-level"></span>
            <span id="spice-text" class="spice-text"></span>
          </div>
          <p class="desc" id="dish-desc"></p>
          <p class="ingredients"><strong>주요 재료: </strong><span id="dish-ingredients"></span></p>
          <p class="tip" id="dish-tip"></p>
        </div>
      </section>

      <section id="results" class="result hidden">
        <div class="result-card">
          <h3 class="results-title">검색 결과</h3>
          <ul class="result-list" id="result-list"></ul>
        </div>
      </section>

      <section id="not-found" class="result hidden">
        <div class="result-card not-found">
          <p>😅 메뉴를 찾지 못했어요</p>
          <p class="hint">위의 자주 찾는 메뉴를 눌러보거나, 직원에게 직접 물어보세요.</p>
        </div>
      </section>
    </main>

    <footer>
      <p>첫 번째 MVP · 메뉴 데이터를 계속 추가할 예정이에요</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
